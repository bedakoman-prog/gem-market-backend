version: "3.8"

# Environnement local minimal pour développer le backend GEM Market.
# Usage : docker compose up -d   (puis npm run prisma:migrate && npm run start:dev)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gem
      POSTGRES_PASSWORD: gem
      POSTGRES_DB: gem_market
    ports:
      - "5432:5432"
    volumes:
      - gem_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  gem_postgres_data:
